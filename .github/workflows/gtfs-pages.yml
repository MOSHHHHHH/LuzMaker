name: Build and publish LZM Maker GTFS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'changes.html'
      - 'favicon.svg'
      - 'logo.svg'
      - 'aliases.js'
      - 'packing.js'
      - 'scripts/**'
      - 'data/operator-website-fallbacks.json'
      - 'tests/**'
      - '.github/workflows/gtfs-pages.yml'
  workflow_run:
    workflows: [Build station change history]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: lzm-maker-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      pages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calendar and 03:00 transport-day behavior
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", src, re.S)
          assert len(scripts) == 1, "Expected exactly one inline script"
          Path("/tmp/lzm-maker-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lzm-maker-ui.js
          node --check aliases.js
          node --check packing.js
      - name: UI and SHES regression smoke tests
        run: |
          node tests/ui-smoke.cjs
          node tests/shes-smoke.cjs
          node tests/aliases-smoke.cjs
          node tests/packing-smoke.cjs
      - name: Verify four-column PDF layout with headless Chrome
        # A PDF regression is surfaced in logs but must never block fresh GTFS data.
        continue-on-error: true
        run: |
          command -v google-chrome || command -v chromium
          node tests/pdf-print-smoke.cjs
      - name: Build schedules from official daily GTFS
        run: python scripts/build_gtfs.py --output _site
      - name: Cache Israeli holiday labels from Hebcal (non-critical)
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          out=Path("_site/data/holidays.json")
          start=json.loads(Path("_site/data/index.json").read_text(encoding="utf-8"))["start"]
          command=[sys.executable,"scripts/build_holidays.py","--start",start,"--days","20","--output",str(out)]
          try:
              subprocess.run(command,check=True,timeout=40)
          except Exception as exc:
              print("WARNING: Hebcal snapshot unavailable; builtin Hebrew-calendar fallback remains active:",exc)
              out.write_text(json.dumps({"source":"local-fallback","events":{}},ensure_ascii=False),encoding="utf-8")
          PY
      - name: Cache official operator-site favicons for offline printing
        run: python scripts/fetch_operator_favicons.py
      - name: Include the website
        run: |
          cp index.html changes.html favicon.svg logo.svg aliases.js packing.js _site/
          mkdir -p _site/data/changes
          heads=$(git ls-remote --heads origin changes-history)
          if [ -n "$heads" ]; then
            git fetch origin changes-history:refs/remotes/origin/changes-history
            git show origin/changes-history:manifest.json > /tmp/change-manifest.json
            asset=$(python -c 'import json; print(json.load(open("/tmp/change-manifest.json"))["asset"])')
            GH_TOKEN="${{ github.token }}" gh release download station-change-state --pattern "$asset" --dir /tmp/change-download
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/change-manifest.json').read_text())
          assert hashlib.sha256((Path('/tmp/change-download')/m['asset']).read_bytes()).hexdigest()==m['sha256']
          PY
            python scripts/change_bundle.py restore /tmp/change-download/"$asset" /tmp/change-restored
            cp -R /tmp/change-restored/changes/. _site/data/changes/
          else
            echo '{"status":"awaiting-first-snapshot","stations":0}' > _site/data/changes/index.json
          fi
          cp scripts/shes.js _site/shes.js
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_site/data/index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['lines']) >= 20, 'Generated dataset is incomplete'
          assert Path('_site/index.html').stat().st_size > 1000
          assert Path('_site/changes.html').exists()
          assert Path('_site/data/changes/index.json').exists()
          assert Path('_site/favicon.svg').exists()
          assert Path('_site/logo.svg').exists()
          assert Path('_site/aliases.js').exists()
          assert Path('_site/packing.js').exists()
          assert Path('_site/data/holidays.json').exists()
          assert Path('_site/shes.js').exists()
          print('Validated', len(data['lines']), 'available bus numbers')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
