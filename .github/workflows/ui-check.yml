name: UI and GTFS regression checks
on:
  push:
    branches: [main, feature/station-change-detector, feature/station-tools-and-pdf]
    paths:
      - 'index.html'
      - 'changes.html'
      - 'pdf.js'
      - 'assets/**'
      - 'packing.js'
      - '.github/workflows/station-changes.yml'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          script, = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/lzm-ui.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/lzm-ui.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('changes.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/lzm-changes.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/lzm-changes.js
          node --check pdf.js
      - name: Exercise the actual UI event flow with simulated data
        run: node tests/ui-smoke.cjs
      - name: Check GTFS time boundaries and exceptions
        run: python -m unittest discover -s tests -v
      - name: Validate generated vector PDFs
        run: |
          python -m pip install --target /tmp/lzm-pdf-check PyMuPDF==1.26.6
          PYTHONPATH=/tmp/lzm-pdf-check node tests/pdf-print-smoke.cjs
      - name: Browser integration for station changes
        run: |
          npm install --prefix /tmp/lzm-browser playwright@1.56.1
          CHROME_BIN=$(command -v google-chrome || command -v chromium) NODE_PATH=/tmp/lzm-browser/node_modules node tests/changes-browser-smoke.cjs
      - name: Browser integration for station tools and direct PDF download
        run: CHROME_BIN=$(command -v google-chrome || command -v chromium) NODE_PATH=/tmp/lzm-browser/node_modules node tests/station-tools-browser-smoke.cjs
